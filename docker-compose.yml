# Runs the SuperKart backend (Flask) and frontend (Streamlit) as two containers
# on one network. Frontend reaches the backend at http://backend:7860.
#
#   docker compose up --build
#
services:
  backend:
    build: ./backend_files
    container_name: superkart-backend
    ports:
      - "7860:7860"

  frontend:
    build: ./frontend_files
    container_name: superkart-frontend
    environment:
      - BACKEND_URL=http://backend:7860
    ports:
      - "8501:8501"
    depends_on:
      - backend
